name: Publish BACKSTOP web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/backstop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BACKSTOP_ADDRESS: 0x85ea679b9f495196A2c229C925dA24Dfc10d3401
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/backstop-web/out
      - id: deployment
        uses: actions/deploy-pages@v4
