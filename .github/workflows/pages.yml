name: Publish BACKSTOP web

on:
  push:
    branches: [main]
    paths:
      - "apps/backstop-web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/backstop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BACKSTOP_ADDRESS: "0x6a5BAF4BE11aC207692a71993D6a40FB08c37400"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/backstop-web/out
      - id: deployment
        uses: actions/deploy-pages@v4
