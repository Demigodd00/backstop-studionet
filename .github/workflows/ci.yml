name: BACKSTOP checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: genvm-lint check contracts/backstop.py
      - run: python scripts/prepare_gltest_runner.py
      - run: pytest -q tests/direct

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backstop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
